<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<style>html,body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>업무 플래너</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout: sticky header with tabs; month view = fluid calendar + agenda column (stacks under 960px); notice/library views are list + detail. Root type is fluid, so every size follows the window. */
:root{
  --bg:#f2f4f8; --surface:#ffffff; --surface-2:#eaeef5; --line:#d6dce7; --fg:#1a2232; --muted:#5b6880;
  --accent:#2b4c9e; --accent-ink:#ffffff; --accent-soft:#e2e8f6;
  --c-month:#2c6bd0; --c-quarter:#1d8556; --c-half:#b8730f; --c-year:#0d7f8c; --c-always:#7252b4; --c-transfer:#bf3a66;
  --ok:#1d8556; --bad:#c43232; --sun:#c43232; --sat:#2c6bd0;
  --shadow:0 .8rem 2.4rem rgb(18 28 56 / .2);
  --f-body:"Noto Sans KR","Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif;
  --r:.45rem;
  /* type scale: title > section heading > body (content, calendar items) > small (labels, meta) */
  --fs-title:1.3rem; --fs-h:1.08rem; --fs-body:1rem; --fs-sm:.86rem;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#10141c; --surface:#171d28; --surface-2:#1e2532; --line:#2b3444; --fg:#e3e7ef; --muted:#93a0b6;
  --accent:#88a5ee; --accent-ink:#0e1422; --accent-soft:#222f50;
  --c-month:#6fa2f0; --c-quarter:#4dbd88; --c-half:#dea040; --c-year:#4fc6d1; --c-always:#a68be6; --c-transfer:#ea7aa1;
  --ok:#4dbd88; --bad:#f07272; --sun:#f07272; --sat:#6fa2f0;
  --shadow:0 .8rem 2.4rem rgb(0 0 0 / .5); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#10141c; --surface:#171d28; --surface-2:#1e2532; --line:#2b3444; --fg:#e3e7ef; --muted:#93a0b6;
  --accent:#88a5ee; --accent-ink:#0e1422; --accent-soft:#222f50;
  --c-month:#6fa2f0; --c-quarter:#4dbd88; --c-half:#dea040; --c-year:#4fc6d1; --c-always:#a68be6; --c-transfer:#ea7aa1;
  --ok:#4dbd88; --bad:#f07272; --sun:#f07272; --sat:#6fa2f0;
  --shadow:0 .8rem 2.4rem rgb(0 0 0 / .5); color-scheme:dark;
}
html{font-size:clamp(10px, .22vw + 8.2px, 13.5px)}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:1rem;line-height:1.5}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
svg.i{width:1em;height:1em;flex:none;vertical-align:-.12em}
a{color:var(--accent)}

#app{padding-inline:clamp(16px,2vw,40px);padding-block:0 3rem;max-width:120rem;margin:0 auto}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding-block:.8rem .65rem;border-bottom:1px solid var(--line);margin-bottom:1.1rem}
.top-row{display:flex;flex-wrap:wrap;align-items:center;gap:.6rem 1.25rem}
.brand{display:flex;align-items:baseline;gap:.55rem;margin-right:auto}
.brand h1{font-size:var(--fs-title);font-weight:700;margin:0;letter-spacing:-.02em}
.brand small{color:var(--muted);font-size:var(--fs-sm)}
.monthnav{display:flex;align-items:center;gap:.25rem}
.monthnav .ml{font-size:var(--fs-h);font-weight:700;background:none;border:0;padding:.1rem .4rem;min-width:8em}
.iconbtn{display:inline-grid;place-items:center;width:2rem;height:2rem;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);color:var(--fg)}
.iconbtn:hover{border-color:var(--accent);color:var(--accent)}
.tabs{display:flex;flex-wrap:wrap;gap:.2rem;background:var(--surface-2);padding:.22rem;border-radius:calc(var(--r) + .2rem)}
.tabs button{border:0;background:none;padding:.35rem .8rem;border-radius:var(--r);color:var(--muted);font-weight:500;white-space:nowrap}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgb(0 0 0 / .08)}
.btn{display:inline-flex;align-items:center;gap:.35rem;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:.4rem .8rem;font-weight:500;white-space:nowrap;text-decoration:none;color:var(--fg)}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--bad)}
.btn.danger.solid{background:var(--bad);color:#fff;border-color:var(--bad)}
.btn.sm{padding:.2rem .55rem;font-size:var(--fs-sm)}
.btn.ghost{border-color:transparent;background:none}
.btn.ghost:hover{background:var(--surface-2)}

/* chips */
.chip{--c:var(--accent);display:inline-flex;align-items:center;gap:.3rem;font-size:var(--fs-sm);font-weight:700;padding:.05rem .5rem;border-radius:999px;color:var(--c);background:color-mix(in srgb,var(--c) 13%,var(--surface));white-space:nowrap}
.chip.plain{--c:var(--muted)}
.chip.bad{--c:var(--bad)}
.chip.ok{--c:var(--ok)}
.memo-ind{display:inline-flex;align-items:center;gap:.15rem;color:var(--c-half);font-size:var(--fs-sm);font-weight:700}
.dot{width:.55rem;height:.55rem;border-radius:50%;background:var(--c);flex:none}

/* stats strip */
.stats{display:flex;flex-wrap:wrap;gap:.4rem 1.75rem;align-items:baseline;padding:.6rem .9rem;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);margin-bottom:.9rem}
.stat{display:flex;align-items:baseline;gap:.45rem}
.stat b{font-size:var(--fs-h);font-weight:700;font-variant-numeric:tabular-nums}
.stat span{color:var(--muted);font-size:var(--fs-sm)}
.stat.bad b{color:var(--bad)}
.legend{margin-left:auto;display:flex;flex-wrap:wrap;gap:.3rem}

/* month layout */
.month-layout{display:grid;grid-template-columns:minmax(0,1fr) clamp(18rem,26vw,28rem);gap:1.1rem;align-items:start}
@media (max-width:960px){.month-layout{grid-template-columns:minmax(0,1fr)}}
.cal{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.cal-head,.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.cal-head div{padding:.35rem .55rem;font-size:var(--fs-sm);font-weight:700;color:var(--muted);background:var(--surface-2)}
.cal-head div:first-child{color:var(--sun)} .cal-head div:last-child{color:var(--sat)}
.cell{min-height:clamp(11rem,26vh,20rem);border-top:1px solid var(--line);border-left:1px solid var(--line);padding:.3rem .32rem .38rem;display:flex;flex-direction:column;gap:.28rem;min-width:0;background:none;border-right:0;border-bottom:0;text-align:left;font:inherit;color:inherit;cursor:pointer}
.cell:nth-child(7n+1){border-left:0}
.cell:hover{background:color-mix(in srgb,var(--accent) 5%,transparent)}
.cell.out{background:var(--surface-2);cursor:default;opacity:.55}
.cell.sel{box-shadow:inset 0 0 0 2px var(--accent)}
.cell .dn{font-size:var(--fs-body);display:flex;align-items:center;gap:.3rem;font-variant-numeric:tabular-nums}
.cell.sun .dn{color:var(--sun)} .cell.sat .dn{color:var(--sat)}
.cell .dn b{font-weight:500}
.cell .hol{font-size:var(--fs-sm);color:var(--sun);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.cell.today .dn b{background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:0 .4rem}
.cchip{--c:var(--accent);display:flex;align-items:center;gap:.25rem;font-size:var(--fs-sm);line-height:1.4;padding:.32rem .4rem;border-radius:.3rem;background:color-mix(in srgb,var(--c) 12%,var(--surface));border-left:3px solid var(--c);white-space:nowrap;overflow:hidden;min-width:0}
.cchip span{overflow:hidden;text-overflow:ellipsis}
.cchip.done{opacity:.5;text-decoration:line-through}
.cchip[draggable="true"]{cursor:grab}
.cchip.dragging{opacity:.35}
.cell.dropover{background:var(--accent-soft);box-shadow:inset 0 0 0 2px var(--accent)}
.cchip.late{box-shadow:inset 0 0 0 1px var(--bad);color:var(--bad)}
.more{font-size:var(--fs-sm);color:var(--muted);padding-left:.3rem}
.dots{display:none;flex-wrap:wrap;gap:.2rem}
@media (max-width:640px){
  .cell .cchip,.cell .more{display:none}
  .dots{display:flex}
  .cell{min-height:3.2rem}
}

/* panels */
.side{display:flex;flex-direction:column;gap:.9rem;min-width:0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:.8rem .9rem;min-width:0}
.panel h3{margin:0 0 .5rem;font-size:var(--fs-h);display:flex;align-items:center;gap:.5rem}
.panel h3 .muted{font-weight:400;font-size:var(--fs-sm)}
.group-label{font-size:var(--fs-sm);font-weight:700;letter-spacing:.06em;color:var(--muted);margin:.65rem 0 .25rem;display:flex;align-items:center;gap:.4rem}
.group-label:first-of-type{margin-top:0}
.empty{color:var(--muted);font-size:var(--fs-sm);padding:.35rem 0;margin:0}

.arow{display:flex;align-items:center;gap:.5rem;padding:.34rem 0;border-bottom:1px dashed var(--line);min-width:0}
.arow:last-child{border-bottom:0}
.arow .lbl{flex:1;min-width:0;background:none;border:0;padding:0;text-align:left;display:flex;flex-direction:column}
.arow .lbl strong{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.arow .lbl small{color:var(--muted);font-size:var(--fs-sm);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
button.lbl:hover strong{color:var(--accent)}
.arow.done .lbl strong{text-decoration:line-through;color:var(--muted)}
.arow .meta{display:flex;align-items:center;gap:.4rem;font-size:var(--fs-sm);flex:none}
.late-t{color:var(--bad);font-weight:700}
.check{--c:var(--accent);width:1.2rem;height:1.2rem;border-radius:.28rem;border:2px solid var(--c);background:var(--surface);display:inline-grid;place-items:center;flex:none;padding:0;color:var(--surface)}
.check[aria-checked="true"]{background:var(--c)}
.check svg{width:.8rem;height:.8rem}

.trow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:.55rem;align-items:center;padding:.4rem 0;border-bottom:1px dashed var(--line);cursor:pointer}
.trow:last-child{border-bottom:0}
.trow:hover .tt{color:var(--accent)}
.tt{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
.sub{color:var(--muted);font-size:var(--fs-sm);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
.bar{height:.32rem;background:var(--surface-2);border-radius:99px;overflow:hidden;width:4rem}
.bar i{display:block;height:100%;background:var(--c,var(--accent))}
.prog{display:flex;align-items:center;gap:.4rem;font-size:var(--fs-sm)}

/* list & tables */
.toolbar{display:flex;flex-wrap:wrap;gap:.55rem;align-items:center;margin-bottom:.9rem}
.toolbar input[type=search],.search{flex:1 1 13rem;min-width:0;max-width:24rem;padding:.4rem .75rem;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.filters{display:flex;flex-wrap:wrap;gap:.3rem}
.filters button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:.2rem .75rem;font-size:var(--fs-sm)}
.filters button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.tablewrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
table{border-collapse:collapse;width:100%;min-width:42rem}
th,td{text-align:left;padding:.5rem .75rem;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:var(--fs-sm);color:var(--muted);font-weight:700;background:var(--surface-2);white-space:nowrap}
tbody tr{cursor:pointer}
tbody tr:hover td{background:color-mix(in srgb,var(--accent) 5%,transparent)}
tr.ended td{opacity:.55}
td.r,th.r{text-align:right}
tr.sec td{background:var(--surface-2);font-weight:700;font-size:var(--fs-sm);cursor:default}
tfoot td{font-weight:700;background:var(--surface-2)}
.amt-in{width:8.5rem;text-align:right;padding:.22rem .45rem;border:1px solid var(--line);border-radius:.35rem;background:var(--bg);font-variant-numeric:tabular-nums}
.amt-in.changed{border-color:var(--c-half)}

/* drawer */
.backdrop{position:fixed;inset:0;background:rgb(10 16 30 / .38);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:clamp(22rem,38vw,42rem);max-width:100%;background:var(--surface);z-index:41;box-shadow:var(--shadow);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (max-width:700px){.drawer{width:100%}}
.d-head{padding:1rem 1.2rem .8rem;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:.4rem}
.d-tags{display:flex;flex-wrap:wrap;gap:.35rem;align-items:center}
.d-head h2{margin:0;font-size:var(--fs-title);font-weight:700;text-wrap:balance;line-height:1.35;overflow-wrap:anywhere}
.d-actions{display:flex;flex-wrap:wrap;gap:.35rem}
.d-body{flex:1;overflow-y:auto;padding:1rem 1.2rem 2rem;display:flex;flex-direction:column;gap:1.25rem}
.d-sec h4{margin:0 0 .45rem;font-size:var(--fs-h);letter-spacing:.04em;color:var(--muted);display:flex;align-items:center;gap:.5rem;flex-wrap:wrap}
.pnav{display:flex;align-items:center;gap:.4rem;margin-left:auto;color:var(--fg);letter-spacing:0;font-size:var(--fs-sm)}
.pnav .iconbtn{width:1.7rem;height:1.7rem}
.confirm{background:color-mix(in srgb,var(--bad) 10%,var(--surface));border:1px solid var(--bad);border-radius:var(--r);padding:.6rem .8rem;display:flex;flex-wrap:wrap;gap:.5rem;align-items:center}
.confirm p{margin:0;flex:1 1 12rem}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:.3rem 1rem;font-size:var(--fs-body);margin:0}
.kv dt{color:var(--muted)} .kv dd{margin:0;overflow-wrap:anywhere}
.box{border:1px solid var(--line);border-radius:var(--r);padding:.7rem .8rem;display:flex;flex-wrap:wrap;gap:.6rem;align-items:center}
.months{display:grid;grid-template-columns:repeat(auto-fill,minmax(5.2rem,1fr));gap:.3rem}
.mcell{border:1px solid var(--line);border-radius:.35rem;padding:.28rem .4rem;font-size:var(--fs-sm);display:flex;flex-direction:column}
.mcell b{font-weight:500;font-size:var(--fs-sm);font-variant-numeric:tabular-nums}
.mcell.paid{border-color:var(--ok)} .mcell.paid em{color:var(--ok)}
.mcell.cur{box-shadow:inset 0 0 0 1px var(--accent)}
.mcell.off{opacity:.45}
.mcell em{font-style:normal;color:var(--muted)}
.pinned{background:color-mix(in srgb,var(--c-half) 10%,var(--surface));border:1px solid color-mix(in srgb,var(--c-half) 40%,var(--line));border-radius:var(--r);padding:.55rem .75rem;white-space:pre-wrap;font-size:var(--fs-body);overflow-wrap:anywhere}
.pinned b{display:block;font-size:var(--fs-sm);color:var(--c-half);margin-bottom:.15rem}
textarea,.field input,.field select,.inline input{width:100%;border:1px solid var(--line);border-radius:var(--r);background:var(--bg);padding:.45rem .65rem;min-width:0}
textarea{resize:vertical;min-height:4.2rem}
.memo-actions{display:flex;justify-content:space-between;align-items:center;gap:.5rem;margin-top:.4rem;flex-wrap:wrap;font-size:var(--fs-sm)}
.tl{list-style:none;margin:.7rem 0 0;padding:0;display:flex;flex-direction:column}
.tl li{display:grid;grid-template-columns:.7rem minmax(0,1fr) auto;gap:.55rem;padding:.45rem 0;border-bottom:1px dashed var(--line)}
.tl li::before{content:"";width:.5rem;height:.5rem;border-radius:50%;background:var(--c-half);margin-top:.45rem}
.tl li.log::before{background:var(--line)}
.tl .when{font-size:var(--fs-sm);color:var(--muted);display:flex;gap:.4rem;flex-wrap:wrap;align-items:center}
.tl .txt{white-space:pre-wrap;overflow-wrap:anywhere}
.tl li.log .txt{color:var(--muted);font-size:var(--fs-sm)}
.x{border:0;background:none;color:var(--muted);padding:.1rem .3rem;border-radius:.3rem;align-self:start}
.x:hover{color:var(--bad);background:var(--surface-2)}
.x.on{color:var(--c-half)}
.smv{display:block;font-size:var(--fs-sm);color:var(--muted);white-space:pre-wrap;overflow-wrap:anywhere;text-decoration:none}
.smv.cur{color:var(--c-half)}
.arow.done .lbl .smv{text-decoration:none}
.smemo-edit{margin:.2rem 0 .7rem 1.7rem;display:flex;flex-direction:column;gap:.45rem}
.smemo-edit textarea{min-height:3.2rem}
.inline{display:flex;flex-wrap:wrap;gap:.4rem;margin-top:.5rem}
.inline input{flex:1 1 7rem;width:auto}

/* edit form */
.form{display:flex;flex-direction:column;gap:.9rem}
.field{display:flex;flex-direction:column;gap:.28rem;min-width:0}
.field>span{font-size:var(--fs-sm);color:var(--muted);font-weight:500}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(10.5rem,1fr));gap:.75rem}
.seg{display:inline-flex;flex-wrap:wrap;gap:.2rem;background:var(--surface-2);padding:.2rem;border-radius:calc(var(--r) + .2rem)}
.seg button{border:0;background:none;padding:.28rem .75rem;border-radius:var(--r);color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);font-weight:700;box-shadow:0 1px 2px rgb(0 0 0 / .1)}
.steps{display:flex;flex-direction:column;gap:.4rem}
.step-row{display:grid;grid-template-columns:1.5rem minmax(0,1fr) auto;gap:.3rem .4rem;align-items:center;padding-bottom:.35rem;border-bottom:1px dashed var(--line)}
.step-row .step-when{grid-column:2/4;flex-wrap:wrap}
.step-row .step-btns{grid-row:1;grid-column:3}
.step-when select{max-width:100%}
.step-row input,.step-row select{border:1px solid var(--line);border-radius:.35rem;background:var(--bg);padding:.34rem .45rem;min-width:0}
.step-when{display:flex;gap:.3rem;align-items:center;font-size:var(--fs-sm)}
.step-when input[type=number]{width:4rem}
.step-no{color:var(--muted);text-align:center;font-size:var(--fs-sm)}
.step-btns{display:flex}
@media (max-width:520px){.step-row{grid-template-columns:1.3rem minmax(0,1fr) auto}.step-when{grid-column:2/3}.step-btns{grid-row:1;grid-column:3}}
.hint{font-size:var(--fs-sm);color:var(--muted);margin:0}
.d-foot{border-top:1px solid var(--line);padding:.75rem 1.2rem;display:flex;justify-content:flex-end;gap:.5rem}

/* notices */
.split{display:grid;grid-template-columns:clamp(14rem,22vw,20rem) minmax(0,1fr);gap:1.1rem;align-items:start}
@media (max-width:820px){.split{grid-template-columns:minmax(0,1fr)}}
.nlist{display:flex;flex-direction:column;gap:.3rem;margin-top:.6rem}
.nitem{display:flex;flex-direction:column;align-items:flex-start;text-align:left;border:1px solid transparent;background:none;border-radius:var(--r);padding:.45rem .6rem;min-width:0}
.nitem:hover{background:var(--surface-2)}
.nitem[aria-current="true"]{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 40%,transparent)}
.nitem strong{font-weight:500;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nitem small{color:var(--muted);font-size:var(--fs-sm)}
.fields{display:grid;grid-template-columns:repeat(auto-fill,minmax(12rem,1fr));gap:.6rem}
.preview{white-space:pre-wrap;background:var(--surface-2);border-radius:var(--r);padding:.85rem 1rem;line-height:1.75;overflow-wrap:anywhere;font-size:var(--fs-body)}
mark.fill{background:color-mix(in srgb,var(--accent) 18%,transparent);color:inherit;border-radius:.2rem;padding:0 .1rem}
mark.miss{background:color-mix(in srgb,var(--bad) 15%,transparent);color:var(--bad);border-radius:.2rem;padding:0 .1rem}
.tbar{display:flex;flex-wrap:wrap;gap:.3rem;align-items:center}
.bodyin{min-height:14rem;line-height:1.7}

/* library */
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(15rem,1fr));gap:.85rem}
.ccard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;cursor:pointer;display:flex;flex-direction:column;text-align:left;padding:0;min-width:0}
.ccard:hover{border-color:var(--accent)}
.ccard .cover{width:100%;aspect-ratio:16/9;object-fit:cover;max-width:100%;display:block;background:var(--surface-2)}
.ccard .cb{padding:.65rem .8rem .75rem;display:flex;flex-direction:column;gap:.35rem;min-width:0}
.ccard .ct{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

function stepMemoCount(t){let n=0;(t.steps||[]).forEach(s=>{if(String(s.memo||'').trim())n++;});Object.values(t.stepNotes||{}).forEach(v=>{if(String(v).trim())n++;});return n;}

const memoBadge=t=>{const n=memoCount(t);return n?'<span class="memo-ind" title="메모 '+n+'개">'+I.memo+n+'</span>':'';};
function addLog(t,text,pk,type){t.memos=t.memos||[];t.memos.push({id:uid(),at:new Date().toISOString(),pkey:pk||null,text:text,type:type||'log'});}
/* a step that falls in a month before the task's start month does not count in that period */
function stepLive(t,s,p){if(t.cycle==='always'||!t.startYm)return true;const sm=stepMonth(t,s,p);return !sm||sm>=t.startYm;}
function progress(t,y,m){
  const p=periodOf(t,y,m);const live=t.steps.filter(s=>stepLive(t,s,p));let done=0;
  live.forEach(s=>{if(isDone(t,p.key,s.id))done++;});
  return {p,total:live.length,done};
}

function monthItems(y,m){
  const k=ymKey(y,m);const items=[];
  for(const t of S.tasks){
    if(t.kind==='transfer'){
      if(t.cycle==='monthly'){
        if(!isActive(t,k))continue;
        items.push({t,type:'tr',date:trDate(t,y,m),label:t.title,amount:amountOf(t,k),done:!!(t.done&&t.done[k]),ym:k});
      }else{
        (t.entries||[]).forEach(e=>{if(e.date&&e.date.slice(0,7)===k)items.push({t,type:'en',date:e.date,label:t.title,amount:e.amount,done:!!e.done,entry:e});});
      }
      continue;
    }
    if(t.cycle==='always'){
      const sp=alwaysSpan(t);
      t.steps.forEach(s=>{
        if(s.date?s.date.slice(0,7)===k:k===sp.end)items.push({t,type:'st',step:s,date:s.date||null,label:s.name,done:isDone(t,'always',s.id),pk:'always'});
      });
      continue;
    }
    if(!isActive(t,k))continue;
    const p=periodOf(t,y,m);
    t.steps.forEach(s=>{if(stepMonth(t,s,p)!==k)return;items.push({t,type:'st',step:s,date:stepDate(t,s,p),label:s.name,done:isDone(t,p.key,s.id),pk:p.key});});
  }
  items.forEach(i=>{i.late=!i.done&&!!i.date&&i.date<TODAY;});
  items.sort((a,b)=>(a.date||'9').localeCompare(b.date||'9')||(a.done-b.done));
  return items;
}

async function flush(c,id,retry){
  if(writing[id]){writing[id].again=true;return;}
  writing[id]={again:false};

    do{
      writing[id].again=false;
      const r=S[c].find(x=>x.id===id);
      if(r){const {error}=await store.sb.from(TABLE).upsert(rowOf(c,r),{onConflict:'user_id,id'});if(error)throw error;}

  };
  const complete=t=>{const pr=progress(t,y,m);return pr.total>0&&pr.done===pr.total;};
  const byTitle=(a,b)=>a.title.localeCompare(b.title,'ko');

  const always=S.tasks.filter(t=>t.kind!=='transfer'&&t.cycle==='always'&&alwaysIn(t,k));

  }

    const list=byDay[S.selDay]||[];
    h+='<section class="panel"><h3>'+md(S.selDay)+(HOL[S.selDay]?' <span class="chip bad">'+esc(HOL[S.selDay])+'</span>':'')+(S.selDay===TODAY?' <span class="chip">오늘</span>':'')+' <span class="muted">'+list.length+'건</span></h3>'+
      (list.length?list.map(i=>agendaRow(i,false)).join(''):'<p class="empty">이 날 예정된 일이 없습니다.</p>')+'</section>';
  }
  const undated=items.filter(i=>!i.date);
  if(undated.length)h+='<section class="panel"><h3>날짜 미정 <span class="muted">'+undated.length+'건</span></h3>'+undated.map(i=>agendaRow(i,true)).join('')+'</section>';
  const lateList=items.filter(i=>i.late);
  if(lateList.length)h+='<section class="panel"><h3 style="color:var(--bad)">지연된 일 <span class="muted">'+lateList.length+'건</span></h3>'+lateList.map(i=>agendaRow(i,true)).join('')+'</section>';
  /* 월 업무 현황 (always last): monthly tasks, plus quarterly/half/yearly only in a month that has one of their steps */
  const tasks=S.tasks.filter(t=>{
    if(t.kind==='transfer'||t.cycle==='always'||!isActive(t,k))return false;
    if(t.cycle==='monthly')return true;
    const p=periodOf(t,y,m);return t.steps.some(s=>stepLive(t,s,p)&&stepMonth(t,s,p)===k);
  });
  const openT=tasks.filter(t=>!complete(t)),doneT=tasks.filter(complete);
  h+='<section class="panel"><h3>'+m+'월 업무 현황 <span class="muted">미완료 '+openT.length+' · 완료 '+doneT.length+'</span></h3>';
  /* transfers pinned at the top of the month status */
  const trs=items.filter(i=>i.type!=='st').sort((a,b)=>(a.done-b.done)||(a.date||'9').localeCompare(b.date||'9'));
  if(trs.length)h+='<div class="group-label"><i class="dot" style="--c:var(--c-transfer)"></i>이체 · 미완료 '+trs.filter(i=>!i.done).length+' / '+trs.length+'</div>'+trs.map(i=>agendaRow(i,true)).join('')+'<div class="group-label" style="margin-top:.9rem">업무</div>';
  if(!tasks.length)h+='<p class="empty">이번 달에 진행할 업무가 없습니다.</p>';
  /* sort by the date of the next unfinished step (undated last); finished tasks by their first step date */
  const keyDate=(t,onlyOpen)=>{const p=periodOf(t,y,m);const ds=t.steps.filter(s=>stepLive(t,s,p)&&stepMonth(t,s,p)===k&&(!onlyOpen||!isDone(t,p.key,s.id))).map(s=>stepDate(t,s,p)||'9').sort();return ds[0]||'9';};
  openT.sort((a,b)=>keyDate(a,true).localeCompare(keyDate(b,true))||byTitle(a,b));
  doneT.sort((a,b)=>keyDate(a,false).localeCompare(keyDate(b,false))||byTitle(a,b));
  h+=openT.map(taskRow).join('');
  if(doneT.length)h+='<div class="group-label" style="margin-top:.9rem">완료</div>'+doneT.map(taskRow).join('');
  h+='</section>';  h+='</div></div>';
  return h;
}

const PH=/\{([^{}\n]{1,30})\}/g;
function autoVars(){
  const d=NOW,tm=new Date(d.getFullYear(),d.getMonth(),d.getDate()+1),nx=new Date(d.getFullYear(),d.getMonth()+1,1);
  const f=x=>(x.getMonth()+1)+'월 '+x.getDate()+'일('+WD[x.getDay()]+')';
  return {'오늘':f(d),'내일':f(tm),'이번달':(d.getMonth()+1)+'월','다음달':(nx.getMonth()+1)+'월','올해':d.getFullYear()+'년'};
}
function fieldsOf(body){const out=[];String(body||'').replace(PH,(m,k)=>{k=k.trim();if(k&&!out.includes(k))out.push(k);return m;});return out;}
function resolve(n,key){const v=(n.values&&n.values[key])||'';if(v.trim())return v;const av=autoVars();return av[key]!=null?av[key]:'';}
function fillHtml(n){
  let out='',last=0;const body=n.body||'';
  body.replace(PH,(m,k,off)=>{out+=esc(body.slice(last,off));const v=resolve(n,k.trim());out+=v?'<mark class="fill">'+esc(v)+'</mark>':'<mark class="miss">'+esc(m)+'</mark>';last=off+m.length;return m;});

}

function shrinkToDataUrl(file,max,q){
  return new Promise((res,rej)=>{const u=URL.createObjectURL(file);const img=new Image();
    img.onload=()=>{const s=Math.min(1,max/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.max(1,Math.round(img.width*s));c.height=Math.max(1,Math.round(img.height*s));
      const g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,c.width,c.height);g.drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(u);res(c.toDataURL('image/jpeg',q));};
    img.onerror=()=>{URL.revokeObjectURL(u);rej(new Error('decode'));};img.src=u;});
}
async function addImages(files){
  const d=S.clipDraft;if(!d)return;
  const imgs=[...files].filter(f=>f&&/^image\//.test(f.type));
  if(!imgs.length){toast('이미지 파일만 넣을 수 있습니다.');return;}
  const assets=await getAssets();
  for(const f of imgs){
    const im={name:f.name||'붙여넣은 이미지',busy:true};d.images.push(im);renderClipImgs();
    try{
      if(assets){
        if(f.size>20*1024*1024)throw {code:'too_large'};
        const r=await assets.upload(f);im.id=r.id;S.clipNewAssets.push(r.id);
      }else{
        let data=await shrinkToDataUrl(f,1280,.75);
        if(data.length>170000)data=await shrinkToDataUrl(f,900,.6);
        if(data.length>170000)data=await shrinkToDataUrl(f,640,.5);
        im.data=data;
      }
      im.busy=false;
    }catch(e){
      d.images=d.images.filter(x=>x!==im);
      toast(e&&e.code==='too_large'?'20MB보다 큰 이미지는 올릴 수 없습니다.':e&&e.code==='quota_or_state'?'이미지 저장 공간이 가득 찼습니다.':'이미지를 올리지 못했습니다.');
    }
    if(S.clipDraft===d)renderClipImgs();
  }
}
async function deleteAssets(ids){
  const used=new Set();S.clips.forEach(c=>c.images.forEach(im=>{if(im.id)used.add(im.id);}));
  const list=ids.filter(id=>id&&!used.has(id));if(!list.length)return;
  const assets=await getAssets();if(!assets)return;
  for(const id of list){try{await assets.delete(id);}catch(e){}}
}
function saveClip(){
  const d=S.clipDraft;

  d.title=(d.title||'').trim();d.category=(d.category||'').trim();
  d.links=d.links.map(l=>({url:normUrl(l.url),label:(l.label||'').trim()})).filter(l=>l.url);
  if(!d.title)d.title=(d.text.trim().split('\n')[0]||'').slice(0,40)||(d.links[0]&&(d.links[0].label||d.links[0].url))||(d.images.length?'이미지 자료':'');
  if(!d.title&&!d.text.trim()){toast('제목이나 내용을 입력해 주세요.');return;}
  d.images=d.images.map(im=>im.id?{id:im.id,name:im.name||''}:{data:im.data,name:im.name||''});
  if(JSON.stringify(d).length>240000){toast('이미지가 너무 커서 저장할 수 없습니다. 이미지 수를 줄여 주세요.');return;}
  const old=!S.clipIsNew&&getC(d.id);
  const removed=old?old.images.filter(im=>im.id&&!d.images.some(x=>x.id===im.id)).map(im=>im.id):[];
  const rec=clone(d);
  if(old)S.clips[S.clips.indexOf(old)]=rec;else{rec.createdAt=Date.now();S.clips.push(rec);}
  saveRec('clips',rec);

}
function cancelClip(){

function toPng(blob){
  if(blob.type==='image/png')return Promise.resolve(blob);
  return createImageBitmap(blob).then(b=>{const c=document.createElement('canvas');c.width=b.width;c.height=b.height;c.getContext('2d').drawImage(b,0,0);return new Promise(r=>c.toBlob(r,'image/png'));});
}
function copyImage(src){
  const fail=()=>toast('이 환경에서는 이미지 복사가 안 됩니다. 이미지를 우클릭해서 복사하세요.');
  try{
    if(!window.ClipboardItem||!navigator.clipboard||!navigator.clipboard.write){fail();return;}
    const p=fetch(src).then(r=>r.blob()).then(toPng);
    navigator.clipboard.write([new ClipboardItem({'image/png':p})]).then(()=>toast('이미지를 복사했습니다.'),fail);
  }catch(e){fail();}
}

      }

      if(S.confirm==='terminate')h+='<div class="confirm" style="margin-top:.7rem"><p>마지막으로 이체할 달을 고르세요. 그 다음 달부터 목록에서 빠집니다.</p><input type="month" id="endYmIn" value="'+k+'" style="border:1px solid var(--line);border-radius:.35rem;padding:.3rem .5rem;background:var(--bg)"><button class="btn sm danger solid" data-act="doTerminate">해지 처리</button><button class="btn sm" data-act="cancelConfirm">취소</button></div>';
      else h+='<div style="margin-top:.7rem">'+(t.endYm?'<button class="btn sm" data-act="unTerminate">해지 취소</button>':'<button class="btn sm danger" data-act="askTerminate">해지 처리</button>')+'</div>';
      h+='</section>';
    }else{
      const es=(t.entries||[]).slice().sort((a,b)=>b.date.localeCompare(a.date));
      h+='<section class="d-sec"><h4>이체 내역 <span class="muted">'+es.length+'건</span></h4>';
      h+=es.length?es.map(e=>'<div class="arow'+(e.done?' done':'')+'">'+checkBtn({t,type:'en',entry:e,done:!!e.done,label:t.title})+'<span class="lbl"><strong class="num">'+won(e.amount)+'원</strong><small>'+md(e.date)+(e.note?' · '+esc(e.note):'')+'</small></span><button class="x" data-act="delEntry" data-eid="'+e.id+'" aria-label="이 이체 건 삭제">'+I.close+'</button></div>').join(''):'<p class="empty">등록된 이체 건이 없습니다.</p>';

    }
  }else{
    const p=periodOf(t,S.y,S.m);
    const rows=t.steps.map(s=>({s,d:stepDate(t,s,p),mk:stepMonth(t,s,p)}));
    if(t.cycle!=='always')rows.sort((a,b)=>(a.mk||'').localeCompare(b.mk||'')||(a.d||'9').localeCompare(b.d||'9'));
    else rows.sort((a,b)=>(a.d||'9').localeCompare(b.d||'9'));
    const inRange=t.cycle==='always'||isActive(t,k);
    const doneN=rows.filter(r=>stepLive(t,r.s,p)&&isDone(t,p.key,r.s.id)).length,liveN=rows.filter(r=>stepLive(t,r.s,p)).length;
    h+='<section class="d-sec"><h4>세부업무 <span class="num">'+doneN+'/'+liveN+'</span>'+
      (t.cycle!=='always'?'<span class="pnav"><button class="iconbtn" data-act="shift" data-n="-'+p.len+'" aria-label="이전 기간">'+I.prev+'</button>'+p.label+'<button class="iconbtn" data-act="shift" data-n="'+p.len+'" aria-label="다음 기간">'+I.next+'</button></span>':'<span class="pnav muted">한 번 진행하면 끝나는 업무</span>')+'</h4>';
    if(!inRange)h+='<p class="empty">이 기간에는 진행하지 않는 업무입니다 ('+(t.startYm?esc(ymLabel(t.startYm)):'처음')+' ~ '+(t.endYm?esc(ymLabel(t.endYm)):'계속')+').</p>';
    rows.forEach(({s,d,mk})=>{
      const live=stepLive(t,s,p),dn=t.done[p.key]&&t.done[p.key][s.id],late=live&&!dn&&d&&d<TODAY;
      const when=(d?md(d):(mk&&t.cycle!=='always'?Number(mk.slice(5))+'월 중':'날짜 미정'))+(live?'':' · 시작 전');
      const sm=stepMemos(t,s,p.key),open=S.stepMemoOpen===s.id;
      const smv=(sm.c?'<span class="smv">'+I.memo+' '+esc(sm.c)+'</span>':'')+(sm.p?'<span class="smv cur">'+I.memo+' '+esc(p.label)+': '+esc(sm.p)+'</span>':'');
      h+='<div class="arow'+(dn?' done':'')+'"'+(live?'':' style="opacity:.55"')+'>'+(inRange&&live?checkBtn({t,type:'st',step:s,pk:p.key,done:!!dn,label:s.name}):'')+

        '<button class="x'+(sm.c||sm.p?' on':'')+'" data-act="stepMemo" data-sid="'+s.id+'" aria-label="세부업무 메모" aria-expanded="'+open+'" title="세부업무 메모">'+I.memo+'</button>'+
        (t.cycle==='always'?'<button class="x" data-act="delStep" data-sid="'+s.id+'" aria-label="세부업무 삭제">'+I.close+'</button>':'')+'</span></div>';
      if(open)h+='<div class="smemo-edit"><label class="field"><span>'+(t.cycle==='always'?'메모':'매달 공통 메모 (절차·참고사항)')+'</span><textarea id="smC" placeholder="어느 달에 봐도 같은 내용">'+esc(s.memo||'')+'</textarea></label>'+
        (t.cycle!=='always'?'<label class="field"><span>'+esc(p.label)+'에만 해당하는 메모</span><textarea id="smP" placeholder="이번 기간 진행 상황">'+esc((t.stepNotes||{})[p.key+'|'+s.id]||'')+'</textarea></label>':'')+
        '<div style="display:flex;gap:.4rem;justify-content:flex-end"><button class="btn sm" data-act="stepMemo" data-sid="'+s.id+'">취소</button><button class="btn sm primary" data-act="stepMemoSave" data-sid="'+s.id+'">메모 저장</button></div></div>';
    });
    if(t.cycle==='always')h+='<div class="inline"><input id="stName" placeholder="세부업무 추가" aria-label="세부업무 이름"><input type="date" id="stDate" aria-label="날짜"><button class="btn sm primary" data-act="addStep">추가</button></div>';
    h+='</section>';
  }
  const ms=(t.memos||[]).slice().sort((a,b)=>b.at.localeCompare(a.at)).filter(x=>S.showLogs||x.type==='memo');
  h+='<section class="d-sec"><h4>메모 · 진행 기록 <span class="num">'+memoCount(t)+'</span></h4>';
  if(t.note&&t.note.trim())h+='<div class="pinned"><b>고정 메모</b>'+esc(t.note)+'</div>';
  h+='<div style="margin-top:.6rem"><textarea id="memoIn" placeholder="진행 상황이나 메모를 남기세요. Ctrl+Enter로 저장" aria-label="메모 입력">'+esc(S.memoDraft)+'</textarea>'+
    '<div class="memo-actions"><label style="display:flex;gap:.35rem;align-items:center"><input type="checkbox" id="showLogs"'+(S.showLogs?' checked':'')+'> 완료·변경 자동 기록도 보기</label><button class="btn sm primary" data-act="addMemo">기록 추가</button></div></div>';
  h+=ms.length?'<ul class="tl">'+ms.map(x=>'<li class="'+(x.type==='memo'?'memo':'log')+'"><div><div class="when"><span class="num">'+stamp(Date.parse(x.at))+'</span>'+(x.pkey?'<span class="chip plain">'+esc(pkeyLabel(x.pkey))+'</span>':'')+'</div><div class="txt">'+esc(x.text)+'</div></div>'+
      (x.type==='memo'?'<button class="x" data-act="delMemo" data-mid="'+x.id+'" aria-label="메모 삭제">'+I.close+'</button>':'<span></span>')+'</li>').join('')+'</ul>':'<p class="empty">아직 기록이 없습니다.</p>';
  h+='</section></div>';
  return h;
}

    h+='<div class="grid2"><label class="field"><span>받는 곳</span><input data-f="payee" value="'+esc(d.payee)+'"></label><label class="field"><span>은행</span><input data-f="bank" value="'+esc(d.bank)+'"></label></div>'+
      '<label class="field"><span>계좌번호</span><input data-f="account" value="'+esc(d.account)+'" inputmode="numeric"></label>';
    if(d.cycle==='monthly')h+='<div class="grid2"><label class="field"><span>기본 금액 (원)</span><input data-f="amount" value="'+esc(d.amount===''?'':won(parseAmt(d.amount)))+'" inputmode="numeric"></label><label class="field"><span>이체일 (매월)</span><input type="number" min="1" max="31" data-f="day" value="'+esc(d.day)+'" placeholder="25"></label><label class="field"><span>날짜 규칙</span><select data-f="rule">'+['auto','nth','prev','next'].map(k=>'<option value="'+k+'"'+((d.rule||'auto')===k?' selected':'')+'>'+RULES[k]+'</option>').join('')+'</select></label></div><p class="hint">매월 금액이 다르면 기본 금액을 넣고, 월별 금액은 이체 관리 화면에서 바꾸세요. 31일처럼 없는 날은 그 달 말일 기준입니다.</p>';
    else h+='<p class="hint">상시 이체는 필요할 때마다 업무 상세에서 날짜와 금액을 넣어 건별로 추가합니다.</p>';

        const rule=s.rule||'auto';
        if(rule==='before'){
          h+='<select data-si="'+i+'" data-sf="ref" aria-label="기준 세부업무"><option value="">기준 세부업무 선택</option>'+d.steps.filter(x=>x!==s).map(x=>'<option value="'+esc(x.id)+'"'+(x.id===s.ref?' selected':'')+'>'+esc(x.name||'(이름 없음)')+'</option>').join('')+'</select>'+
            '<input type="number" min="1" max="20" data-si="'+i+'" data-sf="gap" value="'+esc(s.gap||1)+'" aria-label="몇 영업일 전">영업일 전';
        }else h+='<input type="number" min="1" max="31" data-si="'+i+'" data-sf="day" value="'+esc(s.day||'')+'" placeholder="일" aria-label="날짜(일)">'+(rule==='nth'?'일차':'일');
        h+='<select data-si="'+i+'" data-sf="rule" aria-label="날짜 규칙">'+Object.keys(RULES).map(k=>'<option value="'+k+'"'+(rule===k?' selected':'')+'>'+RULES[k]+'</option>').join('')+'</select>';

    });

  return h;
}
function saveDraft(){
  const d=S.draft;d.title=(d.title||'').trim();
  if(!d.title){toast('이름을 입력해 주세요.');const f=document.getElementById('f-title');if(f)f.focus();return;}
  d.category=(d.category||'').trim();
  if(d.cycle==='always'){delete d.startYm;delete d.endYm;if(!d.createdYm)d.createdYm=TODAY_YM;}
  else if(d.endYm&&d.startYm&&d.endYm<d.startYm){toast('종료월이 시작월보다 빠릅니다.');return;}
  if(d.kind==='task'){
    let st=d.steps.filter(s=>(s.name||'').trim()||(s.day||s.date));
    if(!st.length)st=[{id:uid(),name:d.title,offset:0,day:'',date:''}];
    const len=LEN[d.cycle]||1;
    d.steps=st.map(s=>({id:s.id||uid(),memo:s.memo||'',name:(s.name||'').trim()||d.title,offset:d.cycle==='always'?0:Math.min(len-1,Number(s.offset)||0),day:d.cycle!=='always'&&s.day?Math.min(31,Math.max(1,parseInt(s.day,10)||1)):null,date:d.cycle==='always'?(s.date||null):null}));
    d.steps.forEach(s=>{if(d.cycle==='always'){delete s.rule;return;}const src=st.find(x=>x.id===s.id)||{};s.rule=src.rule||'auto';if(s.rule==='before'){const ref=d.steps.find(x=>x.id===src.ref&&x!==s);if(ref){s.ref=ref.id;s.gap=Math.min(20,Math.max(1,parseInt(src.gap,10)||1));s.offset=ref.offset;s.day=null;}else{s.rule='auto';delete s.ref;delete s.gap;}}});
    ['payee','bank','account','amount','day','amounts','entries'].forEach(k=>delete d[k]);
  }else{
    d.amount=parseAmt(d.amount);d.day=d.day?Math.min(31,Math.max(1,parseInt(d.day,10)||1)):1;if(!['auto','nth','prev','next'].includes(d.rule))d.rule='auto';
    d.steps=[];d.amounts=d.amounts||{};d.entries=d.entries||[];
  }
  if(!d.endYm)delete d.endYm;
  const old=!S.isNew&&get(d.id);
  if(old){
    const ch=[];
    if(old.title!==d.title)ch.push('이름 변경: '+old.title+' → '+d.title);
    if(old.cycle!==d.cycle)ch.push('주기 변경: '+CYC[old.cycle]+' → '+CYC[d.cycle]);
    if(d.kind==='transfer'&&old.amount!==d.amount)ch.push('기본 금액 변경: '+won(old.amount)+' → '+won(d.amount)+'원');
    if(d.kind==='transfer'&&old.day!==d.day)ch.push('이체일 변경: '+old.day+'일 → '+d.day+'일');
    if(d.cycle!=='always'&&(old.endYm||'')!==(d.endYm||''))ch.push(d.endYm?(d.kind==='transfer'?'해지 설정: ':'종료 설정: ')+ymLabel(d.endYm)+'까지':(d.kind==='transfer'?'해지 취소':'종료 취소'));
    if(JSON.stringify(old.steps)!==JSON.stringify(d.steps))ch.push('세부업무 구성 변경 ('+d.steps.length+'단계)');
    if((old.note||'')!==(d.note||''))ch.push('고정 메모 수정');
    if(ch.length)addLog(d,ch.join('\n'),null);
    normalize(d);S.tasks[S.tasks.indexOf(old)]=d;save(d);
  }else{
    normalize(d);d.createdAt=Date.now();addLog(d,(d.kind==='transfer'?'이체':'업무')+' 등록',null);S.tasks.push(d);save(d);
  }
  S.openId=d.id;S.mode='view';S.draft=null;S.isNew=false;toast('저장했습니다.');render();
}
function copyTask(src){
  const c=clone(src);c.id=uid();c.title=src.title+' (복사본)';
  const idMap={};
  c.steps=(c.steps||[]).map(s=>{const nid=uid();idMap[s.id]=nid;return Object.assign(s,{id:nid});});
  const notes={};Object.keys(src.stepNotes||{}).forEach(k=>{const i=k.lastIndexOf('|'),sid=k.slice(i+1);if(idMap[sid])notes[k.slice(0,i)+'|'+idMap[sid]]=src.stepNotes[k];});
  c.stepNotes=notes;
  c.steps.forEach(s=>{if(s.ref&&idMap[s.ref])s.ref=idMap[s.ref];});
  c.done={};c.moves={};if(c.kind==='transfer'){c.amounts={};c.entries=[];}
  const k=curYm();
  if(c.cycle==='always'){delete c.startYm;c.createdYm=TODAY_YM;}else if(!c.startYm||c.startYm<k)c.startYm=k;
  delete c.endYm;
  c.memos=(src.memos||[]).map(x=>Object.assign({},x,{id:uid()}));
  addLog(c,'‘'+src.title+'’에서 복사 (세부업무 메모 포함 메모 '+memoCount(src)+'개)',null);
  c.createdAt=Date.now();normalize(c);S.tasks.push(c);save(c);
  S.clipId=null;S.clipDraft=null;
  S.openId=c.id;S.draft=clone(c);S.isNew=false;S.mode='edit';
  render();toast('메모까지 함께 복사했습니다. 이름과 기간을 확인하고 저장하세요.');
}

function shift(n){const t=new Date(S.y,S.m-1+n,1);S.y=t.getFullYear();S.m=t.getMonth()+1;}
function toggleStep(t,pk,sid){
  const s=t.steps.find(x=>x.id===sid);if(!s)return;
  t.done[pk]=t.done[pk]||{};
  if(t.done[pk][sid]){delete t.done[pk][sid];addLog(t,'‘'+s.name+'’ 완료 취소',pk);}
  else{t.done[pk][sid]=TODAY;addLog(t,'‘'+s.name+'’ 완료',pk);}

  if(t.cycle==='always'&&alwaysSpan(t).complete)addLog(t,'모든 세부업무 완료 · 업무 종료',pk);
  save(t);
}
function setAmount(t,k,v){
  const nv=parseAmt(v),ov=amountOf(t,k);if(nv===ov)return;
  if(nv===t.amount)delete t.amounts[k];else t.amounts[k]=nv;
  addLog(t,ymLabel(k)+' 금액 변경: '+won(ov)+' → '+won(nv)+'원',k);save(t);toast(ymLabel(k)+' 금액을 바꿨습니다.');render();
}

    case 'cImgDel':S.clipDraft.images.splice(Number(a.dataset.i),1);renderClipImgs();break;
    case 'cPin':if(cl){cl.pinned=!cl.pinned;saveRec('clips',cl);render();}break;
    case 'cDup':if(cl){const c=Object.assign(clone(cl),{id:uid(),title:cl.title+' (복사본)',createdAt:Date.now(),pinned:false});S.clips.push(c);saveRec('clips',c);S.clipId=c.id;S.clipDraft=clone(c);S.clipIsNew=false;S.clipNewAssets=[];render();toast('복제했습니다.');}break;
    case 'cAskDel':S.cConfirm=true;renderDrawer();break;
    case 'cCancelDel':S.cConfirm=false;renderDrawer();break;
    case 'cDel':if(cl){const ids=cl.images.map(im=>im.id).filter(Boolean);removeRec('clips',cl.id);deleteAssets(ids);closeDrawer();renderView();toast('삭제했습니다.');}break;
    case 'cCopyText':if(cl)copyText(cl.text,document.getElementById('ctext'));break;
    case 'cCopyLink':if(cl){const l=cl.links[Number(a.dataset.i)];if(l)copyText(l.url,null);}break;
    case 'cCopyImg':if(cl){const im=cl.images[Number(a.dataset.i)];if(im)copyImage(imgSrc(im));}break;
    case 'lb':if(cl){const im=cl.images[Number(a.dataset.i)];if(im){S.lightbox=imgSrc(im);renderLightbox();}}break;
    case 'lbClose':S.lightbox=null;renderLightbox();break;
  }
});
function addMemo(){
  const t=get(S.openId);if(!t)return;const v=S.memoDraft.trim();if(!v){toast('메모 내용을 입력해 주세요.');return;}
  const p=t.kind==='transfer'?(t.cycle==='monthly'?curYm():null):periodOf(t,S.y,S.m).key;
  addLog(t,v,p,'memo');S.memoDraft='';save(t);render();toast('기록을 추가했습니다.');
}
function refocusSearch(id,pos){const n=document.getElementById(id);if(n){n.focus();try{n.setSelectionRange(pos,pos);}catch(err){}}}
document.addEventListener('input',e=>{
  const el=e.target;
  if(el.id==='q'){S.q=el.value;const pos=el.selectionStart;renderView();refocusSearch('q',pos);return;}
  if(el.id==='cq'){S.cq=el.value;const pos=el.selectionStart;renderView();refocusSearch('cq',pos);return;}
  if(el.id==='nq'){S.nq=el.value;const pos=el.selectionStart;renderView();refocusSearch('nq',pos);return;}
  if(el.id==='memoIn'){S.memoDraft=el.value;return;}
  if(el.dataset.nv!=null){const n=getN(S.noticeId);if(n){n.values=Object.assign({},n.values,{[el.dataset.nv]:el.value});saveRec('notices',n);updateNoticePreview(n);}return;}
  if(el.dataset.nd&&S.nEdit){S.nEdit[el.dataset.nd]=el.value;return;}
  if(el.dataset.cf&&S.clipDraft){S.clipDraft[el.dataset.cf]=el.value;return;}
  if(el.dataset.li!=null&&S.clipDraft){const l=S.clipDraft.links[Number(el.dataset.li)];if(l)l[el.dataset.lf]=el.value;return;}
  if(!S.draft)return;
  if(el.dataset.f)S.draft[el.dataset.f]=el.value;
  else if(el.dataset.si!=null){const s=S.draft.steps[Number(el.dataset.si)];if(s)s[el.dataset.sf]=el.value;}
});
document.addEventListener('change',e=>{
  const el=e.target;
  if(el.id==='showLogs'){S.showLogs=el.checked;renderDrawer();return;}
  if(el.id==='importFile'){if(el.files&&el.files[0])importData(el.files[0]);el.value='';return;}
  if(el.id==='clipFile'){if(el.files&&el.files.length)addImages(el.files);el.value='';return;}
  if(el.dataset.amt){const t=get(el.dataset.amt);if(t)setAmount(t,el.dataset.ym,el.value);return;}
  if(S.draft&&el.dataset.si!=null){const s=S.draft.steps[Number(el.dataset.si)];if(s)s[el.dataset.sf]=el.value;if(el.dataset.sf==='rule')renderDrawer();}
});
document.addEventListener('submit',e=>{if(e.target.id==='loginForm'){e.preventDefault();doLogin();}});
document.addEventListener('paste',e=>{
  if(!S.clipDraft||!e.clipboardData)return;
  const files=[...e.clipboardData.items].filter(i=>i.kind==='file'&&/^image\//.test(i.type)).map(i=>i.getAsFile()).filter(Boolean);
  if(files.length){e.preventDefault();addImages(files);}
});
/* calendar drag & drop: move one occurrence to another day */
let dragIt=null;
function moveItem(it,to){
  const t=get(it.t.id),from=it.date;if(!t||!to||to===from)return;
  if(it.type==='st'){
    const s=t.steps.find(x=>x.id===it.step.id);if(!s)return;
    if(t.cycle==='always')s.date=to;
    else{const p=periodOf(t,S.y,S.m),key=p.key+'|'+s.id;t.moves=t.moves||{};if(to===baseStepDate(t,s,p))delete t.moves[key];else t.moves[key]=to;}
    addLog(t,'‘'+s.name+'’ 날짜 이동: '+(from?md(from):'미정')+' → '+md(to),it.pk);
  }else if(it.type==='tr'){
    const key=it.ym+'|tr';t.moves=t.moves||{};if(to===baseTrDate(t,S.y,S.m))delete t.moves[key];else t.moves[key]=to;
    addLog(t,ymLabel(it.ym)+' 이체일 이동: '+md(from)+' → '+md(to),it.ym);
  }else{
    const en=(t.entries||[]).find(x=>x.id===it.entry.id);if(!en)return;en.date=to;
    addLog(t,'이체 건 날짜 이동: '+md(from)+' → '+md(to)+' ('+won(en.amount)+'원)',to.slice(0,7));
  }
  save(t);S.selDay=to;render();toast(md(to)+'로 옮겼습니다.');
}
document.addEventListener('dragstart',e=>{
  const c=e.target.closest&&e.target.closest('.cchip[data-ix]');if(!c)return;
  dragIt=calItems[Number(c.dataset.ix)]||null;
  try{e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',c.dataset.ix);}catch(err){}
  c.classList.add('dragging');
});
document.addEventListener('dragend',e=>{dragIt=null;document.querySelectorAll('.dropover,.dragging').forEach(x=>x.classList.remove('dropover','dragging'));});
document.addEventListener('dragover',e=>{
  const z=e.target.closest&&e.target.closest('#dropZone');if(z){e.preventDefault();z.classList.add('over');return;}
  const cell=dragIt&&e.target.closest&&e.target.closest('.cell[data-d]');
  if(cell){e.preventDefault();e.dataTransfer.dropEffect='move';document.querySelectorAll('.dropover').forEach(x=>x!==cell&&x.classList.remove('dropover'));cell.classList.add('dropover');}
});
document.addEventListener('dragleave',e=>{const z=e.target.closest&&e.target.closest('#dropZone');if(z)z.classList.remove('over');});
document.addEventListener('drop',e=>{
  const z=e.target.closest&&e.target.closest('#dropZone');
  if(z){e.preventDefault();z.classList.remove('over');if(e.dataTransfer&&e.dataTransfer.files.length)addImages(e.dataTransfer.files);return;}
  const cell=dragIt&&e.target.closest&&e.target.closest('.cell[data-d]');
  if(cell){e.preventDefault();const it=dragIt;dragIt=null;moveItem(it,cell.dataset.d);}
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){
    if(S.lightbox){S.lightbox=null;renderLightbox();return;}
    if(S.clipDraft){cancelClip();return;}
    if(S.clipId){closeDrawer();return;}
    if(S.openId||S.mode==='edit'){if(S.mode==='edit'&&S.openId){S.mode='view';S.draft=null;renderDrawer();}else closeDrawer();}
  }
  if((e.key==='Enter'||e.key===' ')&&e.target.classList&&e.target.classList.contains('cell')&&e.target.dataset.d){e.preventDefault();e.target.click();}
  if(e.key==='Enter'&&(e.ctrlKey||e.metaKey)&&e.target.id==='memoIn'){e.preventDefault();addMemo();}
  if(e.key==='Enter'&&e.target.dataset&&e.target.dataset.amt){e.target.blur();}
});
document.addEventListener('click',e=>{if(e.target.matches('.amt-in'))e.stopPropagation();},true);

S.clipNewAssets=[];
render();
initStore();
})();
</script>
